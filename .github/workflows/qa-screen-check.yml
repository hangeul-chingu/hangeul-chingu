name: qa-screen-check
on:
  workflow_dispatch:        # GitHub 화면에서 "Run workflow" 버튼으로 수동 실행
  pull_request:
    paths: ['src/App.jsx']  # 후보 브랜치에서 App.jsx가 바뀐 PR에서만 자동 실행
jobs:
  screen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: 검사 도구 설치
        run: |
          cd qa-kit
          npm i --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - run: node qa-kit/run.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/src/App.jsx"
      - name: 필수 산출물 확인 (없으면 실패)
        run: node qa-kit/verify-outputs.mjs
        env: { QA_OUT: qa-kit/out }
      - name: 결과 요약을 실행 화면에 게시
        if: always()
        run: |
          if [ -f qa-kit/out/REPORT.md ]; then cat qa-kit/out/REPORT.md >> "$GITHUB_STEP_SUMMARY"; else echo "REPORT.md가 만들어지지 않았습니다(검사가 중간에 실패)" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-check-report
          path: |
            qa-kit/out/REPORT.md
            qa-kit/out/spec.json
            qa-kit/out/res_*.json
            qa-kit/out/extra_*.json
            qa-kit/out/shots/
            qa-kit/out/log_*.txt
          if-no-files-found: error
          retention-days: 30
# 한계: 가짜 로그인·저장소, 화면 크기 에뮬레이션. 실기기 확인이 아님. 소스·배포는 건드리지 않음(읽기 전용).
# 결과 문구는 REPORT.md의 고정 머리 문장과 판정 표현을 따름("지정 환경의 N개 검사 PASS, FAIL 0").
